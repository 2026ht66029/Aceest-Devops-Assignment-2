apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app: aceest
    track: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      track: blue
  template:
    metadata:
      labels:
        app: aceest
        track: blue
    spec:
      containers:
        - name: aceest
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels:
    app: aceest
    track: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      track: green
  template:
    metadata:
      labels:
        app: aceest
        track: green
    spec:
      containers:
        - name: aceest
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green
  namespace: aceest
spec:
  selector:
    app: aceest
    track: blue
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
