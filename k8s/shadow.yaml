apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      release: shadow
  template:
    metadata:
      labels:
        app: aceest
        release: shadow
    spec:
      containers:
        - name: aceest
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest
    release: shadow
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
# Traffic mirroring is enabled at the ingress/service-mesh layer. For Istio,
# route the production service to the stable deployment and use a mirror target
# of aceest-shadow before capturing the request/response evidence.
