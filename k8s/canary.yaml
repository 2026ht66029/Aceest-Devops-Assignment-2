apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest
      release: stable
  template:
    metadata:
      labels:
        app: aceest
        release: stable
    spec:
      containers:
        - name: aceest
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      release: canary
  template:
    metadata:
      labels:
        app: aceest
        release: canary
    spec:
      containers:
        - name: aceest
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  selector:
    app: aceest
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
